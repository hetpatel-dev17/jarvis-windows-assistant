name: Bug report
description: Report a reproducible command or workflow failure.
labels: [bug, status:triage]
body:
  - type: textarea
    id: command
    attributes:
      label: Command and steps
      description: Use invented names. Do not include keys, private messages, or real documents.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows and browser version
